version: 2

updates:
  - package-ecosystem: "gomod"
    directory: "/services/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      api-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/services/collector"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      collector-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Workspace root: pnpm-lock.yaml lives here, so this entry covers both the
  # root devDependencies and apps/dashboard in one resolution pass.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      dashboard-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint 10 is blocked upstream: eslint-config-next still bundles an
      # eslint-plugin-react that calls ESLint 9's removed context API
      # ("contextOrFilename.getFilename is not a function").
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # @types/node major must track the Node runtime, which CI pins to 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
